<!doctype html>
<html lang="en">
<head>

<title>Unified Control</title>
<link rel="stylesheet" href="css/tokens.css">

<script type="module" src="js/titlebar.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar"><span class="appname">Unified Control</span><span class="preview-label">Interface preview</span><span class="spacer"></span></header>

    <nav class="nav" aria-label="Pages">
      <button class="nav-item" data-page="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span class="nav-text">Home</span></button>
      <span class="nav-heading">Devices</span>

      <button class="nav-item" data-page="about" aria-label="About"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg><span class="nav-text">About</span></button>

    <main class="pane" id="pane"></main>
  </div>
