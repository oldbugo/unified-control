<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Key quick menu</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/quick-menu.css">
<script type="module" src="js/quick-menu.js"></script>
</head>
<body>
<main class="qm" id="qm" aria-label="Vibe Key quick menu">
  <div class="qm-wheel">
    <svg class="qm-dial" id="qm-dial" role="listbox" aria-label="Quick menu" width="380" height="380" viewBox="-190 -190 380 380"></svg>
    <div class="qm-handle" id="qm-handle" data-tauri-drag-region title="Drag to move the menu" aria-hidden="true"></div>
  </div>
  <div class="qm-caption" id="qm-caption" role="status"></div>
  <div class="qm-foot" id="qm-foot">Turn: move</div>
</main>
</body>
</html>
