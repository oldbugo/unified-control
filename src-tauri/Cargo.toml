[package]
name = "unified-control"
version = "0.0.0"
description = "Unified Control: one tray app for the user's devices"
edition = "2021"
default-run = "unified-control"

[lib]
name = "uc_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
dirs = "6"
ab_glyph = "0.2"
png = "0.18"
ulanzi_dock = { git = "https://github.com/oldbugo/uc-ulanzi", rev = "a46747589f9f8295541ed207ac71d31808cd0992" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Registry", "Win32_System_Memory"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
